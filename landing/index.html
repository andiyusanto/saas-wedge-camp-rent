    <!-- FAQPage schema — teks di bawah ini HARUS sama persis dengan FAQ_ITEMS
         di src/LandingPage.tsx (section FAQ sebelum footer). Kalau ubah
         jawaban di salah satu tempat, update yang satunya juga. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Apa itu Sewalog?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sewalog adalah tools operasional untuk usaha rental alat kamping dan outdoor. Sewalog membantu pemilik usaha kelola stok alat, catat transaksi sewa, dan pantau jaminan & denda — semua dari HP, tanpa aplikasi terpisah atau catatan manual."
            }
          },
          {
            "@type": "Question",
            "name": "Siapa yang cocok pakai Sewalog?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sewalog cocok untuk pemilik atau staf usaha rental alat kamping dan outdoor di seluruh Indonesia. Sewalog dirancang untuk dipakai sambil melayani pelanggan langsung di depan rak alat, bukan buat kerjaan kantor di depan laptop."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah Sewalog berbayar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sewalog gratis sampai 31 Desember 2026. Harga setelah masa uji coba belum ditentukan, dan akan kami umumkan sebelum promo berakhir. Tidak ada tagihan otomatis, jadi kamu bebas memutuskan mau lanjut atau tidak."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana cara mulai pakai Sewalog?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Cara mulai pakai Sewalog adalah dengan menghubungi kami lewat WhatsApp. Ceritakan cara sewa alat di tempat kamu, nanti kami bantu setup akun dan masukkan data alat — tanpa kontrak, tanpa kartu kredit."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah harus download aplikasi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tidak. Sewalog dibuka langsung dari browser HP lewat link, dan bisa ditambahkan ke layar utama supaya dibuka seperti aplikasi."
            }
          },
          {
            "@type": "Question",
            "name": "Ribet nggak masukin data alat satu-satu?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tidak harus satu-satu. Akun pemilik bisa unggah data alat sekaligus dari file Excel (.xlsx atau .csv, maksimal 500 baris) pakai template yang disediakan, dengan pratinjau sebelum disimpan. Alat yang sudah ada otomatis diperbarui, bukan dobel, dan tidak ada data yang terhapus. Foto alat bisa ditautkan lewat link Google Drive."
            }
          },
          {
            "@type": "Question",
            "name": "Bisa untuk harga sewa yang beda tiap hari?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bisa. Tarif bisa diatur per hari sampai hari ke-5 plus tarif untuk hari ke-6 dan seterusnya (contoh: hari 1 Rp30.000, hari 2 Rp20.000, hari 3 dst Rp10.000 — sewa 4 hari jadi Rp70.000), total dihitung otomatis saat mencatat transaksi, dan denda keterlambatan ikut memakai tarif hari berikutnya. Alat dengan harga tetap cukup diisi satu harga."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah data alat dan transaksi aman?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Data tiap usaha disimpan terpisah, jadi rental lain tidak bisa melihat data kamu. Data itu milik usahamu: kami tidak menjual atau memakainya untuk iklan, dan kamu bisa minta salinan atau penghapusan kapan saja. Rinciannya ada di Kebijakan Privasi."
            }
          }
        ]
      }
    </script>
